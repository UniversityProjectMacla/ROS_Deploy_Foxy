# FAST-LIO overrides (merged after mid360.yaml). Knobs = docs/tuning.md §10.
/**:
  ros__parameters:
    publish_tf: false

    preprocess:
      # --- knobs (tuning.md §10) ---
      blind: 0.55
      # --- rest ---
      lidar_type: 4
      scan_line: 4
      timestamp_unit: 3
      scan_rate: 10

    mapping:
      # --- knobs (tuning.md §10) ---
      acc_cov: 0.15
      gyr_cov: 0.15
      det_range: 55.0
      extrinsic_est_en: true
      # --- rest ---
      b_acc_cov: 0.0002
      b_gyr_cov: 0.0002
      fov_degree: 360.0
      extrinsic_T: [-0.011, -0.02329, 0.04412]
      extrinsic_R: [-1., 0., 0., 0., -1., 0., 0., 0., 1.]

    point_filter_num: 2
    max_iteration: 4
    filter_size_surf: 0.45
    filter_size_map: 0.45

    publish:
      path_en: true
      effect_map_en: false
      map_en: true
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true

    pcd_save:
      pcd_save_en: false
      interval: -1
